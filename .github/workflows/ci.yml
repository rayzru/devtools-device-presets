name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run tests
        run: python -m pytest -v

      - name: Smoke test CLI (--dry-run on synthetic profile)
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, tempfile
          from pathlib import Path
          tmp = Path(tempfile.mkdtemp())
          # Mimic Chrome user-data dir on each OS by creating a fake one
          # and pointing the CLI's auto-discovery at it via the package internals.
          from devtools_device_presets import cli
          (tmp / "Default").mkdir()
          (tmp / "Default" / "Preferences").write_text("{}")
          fake = cli.Browser(
              name="chrome",
              user_data_dirs={"darwin":[tmp],"linux":[tmp],"win32":[tmp]},
              process_names=["__none__"],
          )
          cli._browsers = lambda: [fake]
          cli.is_browser_running = lambda: []
          rc = cli.main(["--all"])
          assert rc == 0, f"CLI exited with {rc}"
          prefs = json.loads((tmp / "Default" / "Preferences").read_text())
          assert "custom-emulated-device-list" in prefs["devtools"]["preferences"]
          devices = json.loads(prefs["devtools"]["preferences"]["custom-emulated-device-list"])
          assert len(devices) >= 10, f"only {len(devices)} devices written"
          print(f"OK wrote {len(devices)} devices")
          PY

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
