name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26 / Ubuntu 24.04 / Windows 11
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.3"
  - type: input
    id: browser
    attributes:
      label: Browser & profile
      placeholder: Chrome 147 / Profile 1
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: What command did you run?
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Output / error
      render: shell
