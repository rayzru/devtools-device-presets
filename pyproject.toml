[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devtools-device-presets"
version = "0.1.0"
description = "Curated, opinionated 2026 device preset for Chrome DevTools — zero-dependency installer."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Andrew Rumm", email = "andrew@rumm.im" }]
keywords = ["chrome", "devtools", "emulation", "responsive", "device", "viewport", "frontend"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/rayzru/devtools-device-presets"
Issues = "https://github.com/rayzru/devtools-device-presets/issues"

[project.scripts]
devtools-device-presets = "devtools_device_presets.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devtools_device_presets = ["devices.json"]
